# Put sensitive information in a .env file and reference them here.

services:
  db:
    image: postgres:14-alpine # Official PostgreSQL image. 'alpine' is lighter.
    environment:
      # Environment variables to configure PostgreSQL
      POSTGRES_DB: ${APPRAISE_DB_NAME:-appraise} # Database name. Default: appraise
      POSTGRES_USER: ${APPRAISE_DB_USER:-appraise} # Database user. Default: appraise
      POSTGRES_PASSWORD: ${APPRAISE_DB_PASSWORD:-appraise} # Database password. Default: appraise
    volumes:
      # Persistent volume for PostgreSQL data. This ensures data is not lost on container restart.
      - appraise_db_data:/var/lib/postgresql/data
    ports:
      # Optional: expose the PostgreSQL port to the host.
      # Useful if you need to access the database directly from outside Docker.
      - "5432:5432"
    restart: unless-stopped # Ensures the DB container restarts automatically unless manually stopped.

  web:
    # image: rsn86/appraise:latest # Uncomment this line if you want to use a pre-built image from Docker Hub.
    build: . # Builds the Docker image from the Dockerfile in the current directory.
    # The command to be executed when the web container starts.
    # 'sh -c' is used so that multiple instructions can be executed sequentially and environment variables can be expanded.
    # 'python manage.py migrate' is crucial for applying database migrations before starting the application.
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 ${APPRAISE_WSGI_APPLICATION:-Appraise.wsgi:application} ${GUNICORN_EXTRA_ARGS:-}"
    volumes:
      # Mounts the current host directory to /app in the container.
      # This is useful for development, as local code changes reflect in the container without rebuilding the image.
      # - .:/app
      # Uncomment if you have a specific volume for campaigns
      # - my_campaign:/campaigns
      # Persistent volume for Appraise data directory, as per your specification.
      - appraise_app_data:/data/appraise/data
      - appraise_app_media:/data/appraise/media
      - appraise_app_static:/data/appraise/static
    ports:
      # Maps container port 8000 to host port 8000.
      #- "8000:8000"
    env_file: 
      # Load environment variables from a .env file in the current directory.
      # Ensure this file exists and contains the necessary environment variables.
      - .env
    environment:
      # Environment variables for Appraise's database connection.
      APPRAISE_WSGI_APPLICATION: ${APPRAISE_WSGI_APPLICATION:-Appraise.wsgi:application} # Defines which WSGI app Gunicorn should use
      APPRAISE_DB_ENGINE: django.db.backends.postgresql
      APPRAISE_DB_NAME: ${APPRAISE_DB_NAME:-appraise}
      APPRAISE_DB_USER: ${APPRAISE_DB_USER:-appraise}
      APPRAISE_DB_PASSWORD: ${APPRAISE_DB_PASSWORD:-appraise}
      # APPRAISE_DB_HOST points to the PostgreSQL service name ('db') within the Docker Compose network.
      APPRAISE_DB_HOST: db # Database service name in docker-compose.yml
      APPRAISE_DB_PORT: 5432
      # Passed as a Python dict string - options specific to the db_engine
      APPRAISE_DB_OPTIONS: |
        {"sslmode": "disable", "pool": {"min_size": 1, "max_size": 5}}
      # Passed as a Python dict string - general extra settings for the database connection
      # APPRAISE_DB_EXTRA_SETTINGS
      # Other important environment variables for your Django application (replace with your actual values)
      # VERY IMPORTANT: Change to a strong, unique key in production!
      # APPRAISE_SECRET_KEY
      # Token for health checks, this is optional and can be used to secure health check endpoints.
      # echo "APPRAISE_HEALTH_CHECK_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe())')" >> .env
      # APPRAISE_HEALTH_CHECK_TOKEN
      # Set to empty string "" in production
      APPRAISE_DEBUG: ${DEBUG:-}
      # Define your allowed hosts in production
      APPRAISE_ALLOWED_HOSTS: "${APPRAISE_ALLOWED_HOSTS:-localhost, 127.0.0.1}"
      APPRAISE_DATA_DIR: /data/appraise/data
      APPRAISE_MEDIA_ROOT: /data/appraise/media/ # must end with a slash
      APPRAISE_STATIC_ROOT: /data/appraise/static
      # Environment variables for Gunicorn configuration
      GUNICORN_EXTRA_ARGS: "--access-logfile - --error-logfile -"
    depends_on:
      # Ensures the 'db' service is started before the 'web' service.
      # For a more robust 'healthcheck', you would need to define a 'healthcheck' in the 'db' service.
      - db
    restart: unless-stopped # Ensures the web container restarts automatically.

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - appraise_app_static:/var/www/appraise/static:ro
    depends_on:
      - web
    restart: unless-stopped

# Definition of named volumes
volumes:
  appraise_db_data: # Volume for persistent PostgreSQL data
  appraise_app_data: # Volume for persistent Appraise data
  appraise_app_media: # Volume for Appraise media files
  appraise_app_static: # Volume for Appraise static files